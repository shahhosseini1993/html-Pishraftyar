/* ---- تبدیل تاریخ شمسی/میلادی ---- */

function jalCal(jy){let gy=jy+621,lj=-14,jp=BR[0],jm,jump,i;for(i=1;i<BR.length;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;lj+=dv(jump,33)*8+dv(md(jump,33),4);jp=jm}
let n=jy-jp;lj+=dv(n,33)*8+dv(md(n,33)+3,4);if(md(jump,33)===4&&jump-n===4)lj++;
const lg=dv(gy,4)-dv((dv(gy,100)+1)*3,4)-150,march=20+lj-lg;if(jump-n<6)n=n-jump+dv(jump+4,33)*33;let leap=md(md(n+1,33)-1,4);if(leap===-1)leap=4;return{leap,gy,march}}
const g2d=(y,m,d)=>{let j=dv((y+dv(m-8,6)+100100)*1461,4)+dv(153*md(m+9,12)+2,5)+d-34840408;return j-dv(dv(y+100100+dv(m-8,6),100)*3,4)+752};
function d2g(j){let x=4*j+139361631;x+=dv(dv(4*j+183187720,146097)*3,4)*4-3908;const i=dv(md(x,1461),4)*5+308,gd=dv(md(i,153),5)+1,gm=md(dv(i,153),12)+1;return{gy:dv(x,1461)-100100+dv(8-gm,6),gm,gd}}
const j2d=(y,m,d)=>{const r=jalCal(y);return g2d(r.gy,3,r.march)+(m-1)*31-dv(m,7)*(m-7)+d-1};
function d2j(j){const gy=d2g(j).gy;let jy=gy-621;const r=jalCal(jy);let k=j-g2d(gy,3,r.march);
if(k>=0){if(k<=185)return{jy,jm:1+dv(k,31),jd:md(k,31)+1};k-=186}else{jy--;k+=179;if(r.leap===1)k++}
return{jy,jm:7+dv(k,30),jd:md(k,30)+1}}

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

return`<div class=dp><select id=${id}d>${d}</select><select id=${id}m>${m}</select><select id=${id}y>${y}</select></div>`}

/* ---- داده ---- */
let S={tasks:[],plan:{},notes:{}},cur={tab:(()=>{try{const t=localStorage.getItem('tp_tab');return'dtpabr'.includes(t)&&t?t:'d'}catch(e){return'd'}})(),day:TD(),det:null,sel:null},_a;
try{const r=JSON.parse(localStorage.getItem('tp'));if(r&&r.tasks)S=r}catch(e){}
function snaps(){try{return JSON.parse(localStorage.getItem('tp_s'))||[]}catch(e){return[]}}
function save(){mig();asy();try{const q=$('#sv');if(q)q.textContent='✓ ذخیره خودکار · '+fa(new Date().toLocaleTimeString('en-GB'))}catch(_){}try{localStorage.setItem('tp',JSON.stringify(S));localStorage.setItem('tp_t',Date.now());const sn=snaps(),k=TD();if(!sn.length||sn[0].k!=k){sn.unshift({k,d:JSON.stringify(S)});localStorage.setItem('tp_s',JSON.stringify(sn.slice(0,7)))}else{sn[0].d=JSON.stringify(S);localStorage.setItem('tp_s',JSON.stringify(sn))}}catch(e){}}
const tot=t=>t.e-t.s+1,dn=t=>{let c=0;for(const k in t.log)if(t.log[k].d&&k>=t.s&&k<=t.e)c++;return c},pct=t=>Math.round(dn(t)/tot(t)*100);

const act=j=>S.tasks.filter(t=>t.log[j]&&t.log[j].d).length+(S.plan[j]||[]).filter(x=>x.d).length;
const avg=()=>S.tasks.length?Math.round(S.tasks.reduce((a,t)=>a+pct(t),0)/S.tasks.length):0;

function tf(id){const t=S.tasks.find(x=>x.id==id)||{title:'',desc:'',s:TD(),e:TD()+29,c:CL[S.tasks.length%8]};cur.tp=JSON.parse(JSON.stringify(t.pl||{}));cur.os=t.s;['d','w','m'].forEach(k=>cur.tp[k]=cur.tp[k]||{});

function ts(id){const ti=$('#f1').value.trim(),s=gd('a'),e=gd('b');if(!ti)return toast('عنوان را وارد کنید');if(e<s)return toast('پایان نمی‌تواند قبل از شروع باشد');
